name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

      - name: Build Backend Image
        run: docker build -t $DOCKER_USERNAME/fiap-techchallenge-api:latest .

      - name: Push Backend Image
        run: docker push $DOCKER_USERNAME/fiap-techchallenge-api:latest

      - name: Build Frontend Image
        run: docker build -t $DOCKER_USERNAME/fiap-techchallenge-frontend:latest ./frontend

      - name: Push Frontend Image
        run: docker push $DOCKER_USERNAME/fiap-techchallenge-frontend:latest