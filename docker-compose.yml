services:
  fiap-api:
    build: .
    container_name: fiap-api
    ports:
      - "3000:3000"
    depends_on:
      - fiap-db
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=fiap-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}

  fiap-db:
    image: postgres:16-alpine
    container_name: fiap-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: